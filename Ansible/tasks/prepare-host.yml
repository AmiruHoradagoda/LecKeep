---
- name: Require a supported application host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('22.04', '>=')
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: Automatic host preparation supports Ubuntu 22.04+ on amd64/arm64. For a prepared Linux host, set leckeep_prepare_host=false.

- name: Install Docker repository prerequisites and registry module dependencies
  ansible.builtin.apt:
    name: [ca-certificates, python3-requests]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install the official Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Configure the official Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable"
    filename: docker
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
