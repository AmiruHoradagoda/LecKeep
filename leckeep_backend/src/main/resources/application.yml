spring:
  application:
    name: NoteApp
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldi1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXM=}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:${minio.url}}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:leckeep-documents}

storage:
  provider: ${STORAGE_PROVIDER:minio}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
