name: leckeep

services:
  mongodb:
    image: mongo:7.0
    container_name: leckeep-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: leckeep-minio:local
    build:
      context: ./docker/minio
    pull_policy: build
    container_name: leckeep-minio
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-leckeep-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-leckeep-local-change-me}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: leckeep-backend:local
    build:
      context: ./leckeep_backend
      target: from-source
    pull_policy: build
    container_name: leckeep-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5050}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:-leckeep}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-leckeep}
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: http://${BROWSER_HOST:-localhost}:${MINIO_API_PORT:-19000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-leckeep-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-leckeep-local-change-me}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-leckeep-documents}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      JWT_SECRET: ${JWT_SECRET:-bGVja2VlcC1kZXZlbG9wbWVudC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXM=}
      STORAGE_PROVIDER: minio
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://${BROWSER_HOST:-localhost}:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/swagger-ui/index.html"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: leckeep-frontend:local
    build:
      context: ./leckeep_frontend
      args:
        VITE_API_URL: http://${BROWSER_HOST:-localhost}:${BACKEND_PORT:-5050}/api/v1
    pull_policy: build
    container_name: leckeep-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  minio_data:
